server:
  port: 8082

spring:
  application:
    name: servicio-inventario

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventaya_db}
    username: ${SPRING_DATASOURCE_USERNAME:inventaya}
    password: ${SPRING_DATASOURCE_PASSWORD:inventaya}

  # Este servicio es el dueno del esquema de la base compartida: es el unico que corre Flyway.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 50

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: inventario-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

inventaya:
  jwt:
    # Debe ser la misma clave en todos los servicios (>= 32 caracteres).
    secret: ${INVENTAYA_JWT_SECRET:inventaya-clave-simetrica-de-desarrollo-cambiar-en-produccion}
    issuer: inventaya
    expiracion-minutos: 120
  kafka:
    topics:
      ventas: ventas-topic
      alertas: alertas-topic
    grupo-consumidor: inventario-service-group

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.inventaya: INFO
