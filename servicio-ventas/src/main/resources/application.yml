server:
  port: 8081

spring:
  application:
    name: servicio-ventas

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventaya_db}
    username: ${SPRING_DATASOURCE_USERNAME:inventaya}
    password: ${SPRING_DATASOURCE_PASSWORD:inventaya}

  # El esquema de inventaya_db lo migra servicio-inventario, que es su dueno.
  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 50

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

inventaya:
  jwt:
    # Debe ser la misma clave en todos los servicios (>= 32 caracteres).
    secret: ${INVENTAYA_JWT_SECRET:inventaya-clave-simetrica-de-desarrollo-cambiar-en-produccion}
    issuer: inventaya
    expiracion-minutos: 120
  kafka:
    topics:
      ventas: ventas-topic
      alertas: alertas-topic

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.inventaya: INFO
