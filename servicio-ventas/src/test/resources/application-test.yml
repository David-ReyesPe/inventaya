# Perfil de pruebas: base H2 en memoria creada desde las entidades (incluida la vista de solo
# lectura de productos, que en produccion vive en la base compartida) y Kafka desactivado a
# nivel de conexion -- el productor se sustituye por un mock.
spring:
  datasource:
    url: jdbc:h2:mem:inventaya_ventas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

  kafka:
    bootstrap-servers: localhost:19092

inventaya:
  jwt:
    secret: clave-de-pruebas-inventaya-con-mas-de-32-caracteres
  kafka:
    crear-topicos: false

logging:
  level:
    com.inventaya: DEBUG
    org.hibernate.SQL: WARN
