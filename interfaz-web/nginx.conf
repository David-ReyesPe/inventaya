server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index dashboard.html;

    # La interfaz y las APIs se sirven bajo el mismo origen, de modo que el navegador no
    # necesita CORS y los servicios no exponen configuracion extra para el front.
    #
    # El enrutado por prefijo funciona sin ambiguedad porque los dos servicios no comparten
    # rutas: Ventas es dueno de /api/ventas y Inventario de /api/productos y /api/alertas.

    location /api/ventas {
        proxy_pass http://servicio-ventas:8081;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # Emisor de tokens de prueba del perfil dev (la clave JWT es la misma en ambos servicios,
    # asi que el token que emite Ventas tambien vale contra Inventario).
    location /api/dev {
        proxy_pass http://servicio-ventas:8081;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    location /api/productos {
        proxy_pass http://servicio-inventario:8082;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    location /api/alertas {
        proxy_pass http://servicio-inventario:8082;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
